
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Form Assistant</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="container">

        <header>
            <h2>AI Form Assistant</h2>
            <p>Fill website forms intelligently.</p>
        </header>

        <!-- Authentication -->
        <section class="profile-section">
            <h3>Account</h3>

            <p id="authStatus">Not signed in</p>

            <button id="googleLoginButton">
                Sign in with Google
            </button>

            <button id="logoutButton" hidden>
                Sign Out
            </button>
        </section>

        <!-- Document Upload -->
        <section class="profile-section">
            <h3>Upload Your Documents</h3>

            <p>Select your academic and identity documents (PDF only).</p>

            <input
                type="file"
                id="documentFiles"
                accept=".pdf,application/pdf"
            >

            <button id="uploadDocumentsButton">
                Upload Documents
            </button>

            <p id="uploadStatus"></p>
        </section>

        <!-- Student Profile -->
        <section class="profile-section">
            <h3>Student Profile</h3>

            <p id="profileStatus">
                Sign in to load your profile.
            </p>

            <button id="refreshProfileButton">
                Refresh Profile
            </button>
        </section>

        <!-- Autofill -->
        <section class="actions">
            <button id="fillFormButton">
                ✨ Fill This Website
            </button>
        </section>

        <p id="statusMessage">Ready to assist.</p>

        <footer>
            <p>AI Form Assistant v1.0.0</p>
        </footer>

    </div>

    <script src="popup.js"></script>
</body>
</html>
